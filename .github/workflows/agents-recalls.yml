# Recall & Safety agent (tools/terminal/agents/recalls.py): official cannabis recalls, health & safety advisories and
# failed-lab-test notices from state regulators (CA, MI, CO, WA, OR, NY, MO, NV, MA) and FDA (openFDA enforcement + CBD warning letters).
# Hourly at most, polite user agent, cached detail pages. Commits ONLY when the notices really changed, plus a heartbeat
# commit at most every 6 h so the tab's "live" status (re-checked within 8 h) stays true.
# Copy to .github/workflows/agents-recalls.yml (needs a token with workflow scope).
name: Recall & Safety (hourly)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: agents-recalls
  cancel-in-progress: false
jobs:
  recalls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Detroit
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pdftotext (Nevada / Michigan bulletins are PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Run Recall & Safety
        run: python3 tools/terminal/agents_run.py recalls
      - name: Publish only if the notices changed
        id: publish
        run: |
          git config user.name "Tutchgrass Agents"
          git config user.email "tutchgrass@mail.grokbot.com"
          python3 tools/terminal/publish.py --name "Recall & Safety" \
            --heartbeat tools/terminal/data/recalls.json:6 \
            --owned tools/terminal/data/recalls.json tools/terminal/data/recalls_cache.json
