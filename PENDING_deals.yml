# Deals agent (TEST) (tools/terminal/agents/deals.py): current licensed-dispensary deals in every US state (plus DC) with
# legal dispensaries, read only from each chain's own public deals page (robots.txt checked first), each deal linked to its source.
# About 100 store pages across 40+ markets, so allow up to 15 minutes. Expired deals are dropped.
# Three times a day. Commits ONLY when the deals really changed, plus a heartbeat commit at most every 6 h so the
# tab's "live" status (re-checked within 26 h) stays true.
# NOT INSTALLED. Copy to .github/workflows/agents-deals.yml (needs a token with workflow scope) only after the
# deals-agent branch is merged; publish.py pushes to main.
name: Deals (3x daily, test)
on:
  schedule:
    - cron: "41 11,17,23 * * *"   # 07:41, 13:41, 19:41 America/Detroit (EDT)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: agents-deals
  cancel-in-progress: false
jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Detroit
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Deals
        run: python3 tools/terminal/agents_run.py deals
      - name: Publish only if the deals changed
        id: publish
        run: |
          git config user.name "Tutchgrass Agents"
          git config user.email "tutchgrass@mail.grokbot.com"
          python3 tools/terminal/publish.py --name "Deals" \
            --heartbeat tools/terminal/data/deals.json:6 \
            --owned tools/terminal/data/deals.json public/terminal/data/deals.json
